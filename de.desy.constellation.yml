id: de.desy.constellation
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: Satellite
finish-args:
  - --share=network
  - --filesystem=home
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/*.a
  - /lib/pkgconfig
  - /share/man
  - /share/pkgconfig
modules:
  - pypi-dependencies.json
  - name: Constellation
    buildsystem: meson
    config-opts:
      - -Dimpl_py=enabled
      - -Dbuildtype=release
      - -Dwerror=false
      - -Db_lto=true
      - -Dcxx_tools=false
      - -Dcxx_tests=disabled
      - -Dsatellite_dev_null_receiver=true
      - -Dsatellite_mattermost=true
      - -Dsatellite_nextcloud_talk=true
      - -Dsatellite_random_transmitter=true
    sources:
      - type: archive
        url: https://gitlab.desy.de/constellation/constellation/-/releases/v1.0.2/downloads/Constellation-v1.0.2.tar.xz
        sha256: adcb04c8faa1c973ae317dcb20ba3ee480a7495567f0c7e06aabce3447dbcc35
